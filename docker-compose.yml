services:
  lunacross:
    build: .
    container_name: lunacross
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
