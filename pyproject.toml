[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunacross"
version = "0.1.0"
description = "Compute exact topocentric Moon position and monitor local ADS-B aircraft for lunar transits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skyfield>=1.49",
    "httpx>=0.27",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
lunacross = "lunacross.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lunacross"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
