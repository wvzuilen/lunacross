# Example configuration for LunaCross
# Copy this file to config.toml to customize your settings.

# Exact observer location (WGS-84)
latitude = 52.3731
longitude = 4.8926
elevation_m = 2.0

# URL to your ADS-B receiver's tar1090/readsb JSON feed
adsb_url = "http://adsb.local:8090/data/aircraft.json"

# Optional community ADS-B supplement feed (e.g. adsb.lol) to extend range and add aircraft type/reg metadata
# Supports {lat}, {lon}, and {dist_nm} placeholders
# supplement_url = "https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{dist_nm}"
supplement_radius_nm = 45.0
supplement_interval_s = 5.0

# Poll interval in seconds during live monitoring
poll_interval_s = 1.0

# Angular margin (degrees) around the lunar limb for NEAR_MISS / INCOMING alerts
alert_margin_deg = 0.5

# Angular radius (degrees) from Moon center to record complete close-pass tracks
log_margin_deg = 5.0

# Lookahead horizon in seconds for flight path prediction
predict_horizon_s = 120.0

# Minimum Moon altitude in degrees before transits/predictions trigger alerts
min_moon_alt_deg = 0.0

# Maximum age of the latest ADS-B position report in seconds
max_seen_pos_s = 30.0

# JSONL log file for detected transit events
log_file = "transits.jsonl"

# JSONL file storing full trajectory records for every pass within log_margin_deg
passes_file = "passes.jsonl"

# Show macOS Notification Center alerts on transit or incoming transit
notify_macos = true

# Optional webhook URL (e.g. for n8n or Home Assistant)
# webhook_url = "http://localhost:5678/webhook/lunacross"

# Pushover notifications (create an app at https://pushover.net/apps/build)
# pushover_app_token = "a..."
# pushover_user_key = "u..."
# Optional target device name (empty = all devices)
# pushover_device = "iphone"
# Optional notification sound (e.g. "cosmic", "magic", "siren")
# pushover_sound = "cosmic"
# Priority (-2 to 1; 1 = high priority with immediate sound)
pushover_priority = 1
# Comma-separated event types to send via Pushover: INCOMING, TRANSIT, NEAR_MISS
pushover_events = "INCOMING,TRANSIT"
# Maximum lead time (seconds) before closest approach to trigger an INCOMING Pushover alert
pushover_max_lead_s = 60.0
# Angular margin (degrees) around the lunar limb for INCOMING alerts
pushover_margin_deg = 0.25

# Cache directory for Skyfield ephemeris files (de421.bsp)
ephemeris_dir = ".cache/skyfield"

# Maximum number of closest aircraft shown in the dashboard table
top_n = 12

# Built-in Live Sky View & Pass Replay web server port (0 = disabled, e.g. 8091)
web_port = 0
